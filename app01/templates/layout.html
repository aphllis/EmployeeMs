<!--定义母版-->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-5.3.8/css/bootstrap.css'%}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .nav-avatar {
            border-Radius: 50%;
            display: block;
            width: 24px;
            height: 24px;
            flex-Shrink:0;
        }
    </style>
    {% block css %}
    {% endblock %}
</head>
<body>
<div class="navbar navbar-expand-lg bg-body-tertiary mb-3">
    <div class="container">
        <a class="navbar-brand" href="#">联通员工管理系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav nav-fill me-auto">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/admin/lst">管理员账户</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/depart/lst">部门管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/usr/lst">用户管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/tel/lst">靓号管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/task/lst">任务管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/order/lst">订单管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/chart/lst">数据统计</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/login/">登录</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">
<!--                        <img class="nav-avatar" src="" alt="用户头像">-->
                        {{ request.session.info.username }}
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item " href="#" id="profile">个人资料</a></li>
                        <li><a class="dropdown-item" href="#">我的信息</a></li>
                        <li><a class="dropdown-item" href="/login/">切换账号</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" href="/logout/">注销</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</div>
<div>
    {% block content %}
    {% endblock %}
</div>
<script src="{% static 'js/jquery-4.0.0.js' %}"></script>
<script src="{% static 'plugins/bootstrap-5.3.8/js/bootstrap.bundle.js'%}"></script>
{% block js %}
{% endblock %}
</body>
</html>

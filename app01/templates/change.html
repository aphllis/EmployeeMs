{% extends 'layout.html' %}
{% load static %}
{% block css %}
<!--<link rel="stylesheet" href="{% static 'plugins/bootstrap-datetimepicker-master/css/bootstrap-datetimepicker.css'%}">-->
<link rel="stylesheet" href="{% static 'plugins/datetimepicker-master/build/jquery.datetimepicker.min.css'%}">
{% endblock %}
{% block content %}
<div class="card m-auto" style="width: 80rem">
    <div class="card-header align-items-centerr">
        {{title}}
    </div>
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}
            <div class="form-label">{{field.label}}</div>
            {{field}}
            <div style="color: #e22030;font-size: 0.8em">{{field.errors.0}}</div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">提交</button>
        </form>
    </div>
</div>
{% endblock %}
{% block js %}
<script src="{% static 'js/jquery-4.0.0.js'%}"></script>
<script src="{% static 'plugins/datetimepicker-master/build/jquery.datetimepicker.full.js'%}"></script>
<script type="text/javascript">
    $(function () {
        $("#id_entrytime").datetimepicker({
            timepicker: false,
            format: "Y-m-d",
            lang: "zh"
        })
    })
</script>
{% endblock%}

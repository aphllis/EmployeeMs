{% extends 'layout.html' %}
{% block content %}
<div class="card m-auto" style="width: 80rem">
    <div class="card-header align-items-centerr">
        添加用户
    </div>
    <div class="card-body">
        <!--        novalidate 表单提交时关闭浏览器的校验-->
        <form method="post" novalidate>
            {% csrf_token %}
            <!--    form.name.label 取models.py文件中，对应建表的字段的verbose_name的值，一般为中文-->
            <!--    {{form.name.label}}:{{ form.name }}-->
            <!--    {{form.password.label}}:{{ form.password }}-->
            <!--    {{form.age.label}}:{{ form.age }}-->

            <!--    循环写法-->
            {% for field in form %}
            <div>
                <label class="form-label">{{field.label}}</label>
                {{field}}
                <!-- 如果提交后校验失败，将会展示错误信息，错误信息是列表，展示第一个-->
                <span style="color: #e22030">{{field.errors.0}}</span>
                {% endfor %}
            </div>

            <button type="submit" class="btn btn-primary">提交</button>

        </form>

    </div>
</div>
{% endblock %}

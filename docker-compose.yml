services:
  web:
    build:
      context: .
    container_name: employeems-web
    restart: unless-stopped

    ports:
      - "8000:8000"
    
    env_file:
      - .env
    
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: employeems-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
    
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  
  redis:
    image: redis:7
    container_name: employeems-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  mysql_data: